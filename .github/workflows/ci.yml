name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine, Live Board server and delivery page tests
        run: npm test
      - name: Build the Live Board and the delivery page
        run: npm run dashboard:build
      - name: Release scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
