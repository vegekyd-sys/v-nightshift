apiVersion: nightshift.versa.ai/v1alpha1
kind: Workflow
metadata:
  id: xingqing-content-delivery
  version: 0.3.1-draft
  name: 星擎内容交付
spec:
  ownerAgentRole: content-operator
  concurrency:
    perInstance: 1
    maxActiveInstances: 3
  inputs:
    customerId:
      type: string
      required: true
    briefUrl:
      type: string
      required: true
    targetCount:
      type: integer
      required: true
    authorizationScope:
      type: object
      required: true
  stages:
    - id: plan
      title: 需求与策划
      actor: agent
      skills:
        - lark-base
        - lark-doc
        - max-qijian-planning-doc
      description: 读取需求、解决缺失项、生成或复用策划，并确定路线和数量。
      outputs: [requirementSnapshot, planUrl, route, targetCount]
      completeWhen:
        - output.requirementSnapshot.traceable
        - output.planUrl.reachable
        - output.route.allowed
        - output.targetCount.positive
      timeout: 30m
      retry:
        maxAttempts: 2
        idempotencyKey: "${instance.id}:plan:${input.hash}"
      next: [materials]

    - id: materials
      title: 素材准备
      actor: agent
      skills:
        - shooting-checklist-v2
        - scene-cli
        - material-verification
      description: 生成拍摄要求；已有素材则直接验真冻结，缺素材时创建人工待办并等待 Scene 就绪。
      needs: [plan]
      outputs: [shootingRequest, sceneProject, frozenMaterialManifest]
      completeWhen:
        - output.frozenMaterialManifest.accessible
        - output.frozenMaterialManifest.routeFit
      humanTask:
        when: output.frozenMaterialManifest.missingRequiredAssets
        title: 完成拍摄并把素材放入 Scene
      timeout: 7d
      retry:
        maxAttempts: 2
        idempotencyKey: "${instance.id}:materials:${input.hash}"
      next: [produce]

    - id: produce
      title: 内容生产
      actor: agent
      skills:
        - montage-script-writer
        - makaron
        - background-worker-contract
      description: 编译生产包，生成样片并机器 QC；样片通过后在同一阶段内完成目标数量和逐条 QC。
      needs: [materials]
      sideEffects: [paid-production]
      approval:
        before: paid-production
        scope: instance
      outputs: [productionPackage, finishedAssets, machineQc]
      completeWhen:
        - output.finishedAssets.passedCountEqualsTarget
        - output.machineQc.terminalForEveryAsset
      timeout: 4h
      retry:
        maxAttempts: 3
        idempotencyKey: "${instance.id}:produce:${input.hash}"
      next: [review]

    - id: review
      title: 成片审核
      actor: human
      needs: [produce]
      description: 在 Workboard 中查看成片、QC 和版本，批准、退回修改或终止。
      approval:
        actions: [approve, request-changes, reject]
        evidenceRequired: true
      outputs: [approvedAssetVersions]
      timeout: 3d
      next: [publish]

    - id: publish
      title: 文案与发布
      actor: agent
      skills:
        - lark-base
        - social-search-apify-first
        - geelark-cloud-phone
      needs: [review]
      description: 生成文案和唯一发布键，按批准范围单次提交并回收真实 TikTok 链接。
      sideEffects: [external-publication]
      approval:
        before: external-publication
        scope: asset-and-account
      outputs: [publishTask, publicUrl, publicationEvidence]
      completeWhen:
        - output.publicUrl.reachable
        - output.publicationEvidence.accountMatches
      timeout: 2h
      retry:
        maxAttempts: 3
        idempotencyKey: "${instance.id}:publish:${input.assetHash}:${input.accountId}"
      next: [measure]

    - id: measure
      title: 数据回收与复盘
      actor: agent
      skills:
        - social-search-apify-first
        - lark-base
      needs: [publish]
      description: 到统计窗口后回收数据，明确 UNKNOWN，形成复盘并建议关闭、补救或新建下一轮。
      waitUntil: "${input.metricsWindow}"
      outputs: [metricsSnapshot, retrospective, nextCycleRecommendation]
      completeWhen:
        - output.metricsSnapshot.traceable
        - output.retrospective.evidenceLinked
      timeout: 7d
      retry:
        maxAttempts: 4
        idempotencyKey: "${instance.id}:measure:${input.hash}"
